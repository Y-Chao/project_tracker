name: tracker-sync

on:
  push:
    branches:
      - main
    paths:
      - "project*/README.md"
      - "scripts/generate_project_index.py"
      - ".github/workflows/tracker-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Sync metadata from upstream repos (first-time populate)
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/sync_from_upstream.py

      - name: Regenerate project table
        run: python scripts/generate_project_index.py

      - name: Commit updated files
        run: |
          if git diff --quiet; then
            echo "No changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "chore: auto-sync project table and Last Updated"
          git push
